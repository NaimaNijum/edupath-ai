services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edupath-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: edupath
      POSTGRES_PASSWORD: edupath
      POSTGRES_DB: edupath

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupath -d edupath"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edupath-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:

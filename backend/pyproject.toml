[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "google-auth>=2.56.3",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
